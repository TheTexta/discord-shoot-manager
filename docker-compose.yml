services:
    tvm-verification:
        build: .
        restart: unless-stopped
        init: true
        stop_grace_period: 30s
        environment:
            DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?required}
            DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:?required}
            MEMBERSHIP_ENABLED: ${MEMBERSHIP_ENABLED:-true}
            DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
            BOT_ADMIN_ROLE_ID: ${BOT_ADMIN_ROLE_ID:-}
            ADMIN_ALERT_CHANNEL_ID: ${ADMIN_ALERT_CHANNEL_ID:-}
            MEMBER_ROLE_ID: ${MEMBER_ROLE_ID:-}
            EXEC_ROLE_ID: ${EXEC_ROLE_ID:-}
            UNVERIFIED_ROLE_ID: ${UNVERIFIED_ROLE_ID:-}
            PRODUCTION_ACCESS_ROLE_ID: ${PRODUCTION_ACCESS_ROLE_ID:-}
            SHOOT_ELIGIBLE_ROLE_IDS: ${SHOOT_ELIGIBLE_ROLE_IDS:-}
            SHOOT_TIMEZONE: ${SHOOT_TIMEZONE:-America/Toronto}
            UI_TEXT_PATH: ${UI_TEXT_PATH:-}
            SHOOT_ANNOUNCEMENT_CHANNEL_ID: ${SHOOT_ANNOUNCEMENT_CHANNEL_ID:-}
            SHOOT_CATEGORY_ID: ${SHOOT_CATEGORY_ID:-}
            SHOOT_ARCHIVE_CATEGORY_ID: ${SHOOT_ARCHIVE_CATEGORY_ID:-}
            TVM_GUILD_ID: ${TVM_GUILD_ID:-}
            TVM_MEMBER_ROLE_ID: ${TVM_MEMBER_ROLE_ID:-}
            TVM_EXEC_ROLE_ID: ${TVM_EXEC_ROLE_ID:-}
            TVM_ADMIN_ROLE_ID: ${TVM_ADMIN_ROLE_ID:-}
            TVM_PRODUCTION_ACCESS_ROLE_ID: ${TVM_PRODUCTION_ACCESS_ROLE_ID:-}
            TVM_UNVERIFIED_ROLE_ID: ${TVM_UNVERIFIED_ROLE_ID:-}
            TVM_ADMIN_ALERT_CHANNEL_ID: ${TVM_ADMIN_ALERT_CHANNEL_ID:-}
            SMTP_FROM: ${SMTP_FROM:-}
            RESEND_API_KEY: ${RESEND_API_KEY:-}
            SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
            SMTP_PORT: ${SMTP_PORT:-465}
            VERIFICATION_CODE_SECRET: ${VERIFICATION_CODE_SECRET:-}
            TVM_DATABASE_PATH: /usr/app/config/tvm.db
            TVM_SHOOT_ANNOUNCEMENT_CHANNEL_ID: ${TVM_SHOOT_ANNOUNCEMENT_CHANNEL_ID:-}
            TVM_SHOOT_CATEGORY_ID: ${TVM_SHOOT_CATEGORY_ID:-}
            TVM_SHOOT_ARCHIVE_CATEGORY_ID: ${TVM_SHOOT_ARCHIVE_CATEGORY_ID:-}
        volumes:
            - tvm_data:/usr/app/config

volumes:
    tvm_data:
